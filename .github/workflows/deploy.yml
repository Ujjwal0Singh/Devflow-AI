name: DevFlow AI Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  audit-and-verify:
    name: 🛡️ CI Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Initialize Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 22 # Updated to node 22 to clear that deprecation warning log
        
    - name: Install & Verify Backend Environment
      run: |
        cd server
        npm install # Replaced 'npm ci' with 'npm install' for flexible directory parsing
        
    - name: Install & Verify Frontend Environment
      run: |
        cd client
        npm install

  deploy-backend:
    name: 🚀 CD Backend (Render)
    needs: audit-and-verify
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Render Microservice Deployment
      # This step will gracefully fail or skip until we add your Render webhook key in Step 3
      continue-on-error: true 
      run: |
        if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          echo "Render deploy token not found. Skipping continuous deployment steps."
        else
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        fi